[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.28"
evm_version = "paris"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/"]
optimizer = true
optimizer_runs = 200
via_ir = true
libs = ["node_modules", "lib"]
